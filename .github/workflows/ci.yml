name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Falhar em warning mantem o core limpo; a sessao anterior deixou clippy zerado.
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: Core (fmt, clippy, testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  wasm:
    name: WASM + frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do frontend
        working-directory: frontend
        run: npm ci

      - name: Build (wasm-pack + tsc + vite)
        working-directory: frontend
        run: npm run build

      - name: Guardar o site para o deploy
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: frontend/dist
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias do frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar o Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Guardar o relatorio em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    # So faz sentido em PR: em push direto nao ha faixa de commits definida.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar as mensagens de commit do PR
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9,-]+\))?!?: .{1,72}$'
          failed=0
          range='${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}'
          while read -r subject; do
            [ -z "$subject" ] && continue
            # Merges nao seguem o padrao e sao gerados pelo proprio GitHub.
            case "$subject" in "Merge "*) continue ;; esac
            if ! printf '%s' "$subject" | grep -Eq "$pattern"; then
              echo "::error::Commit fora do Conventional Commits: $subject"
              failed=1
            fi
          done < <(git log --format=%s "$range")
          exit $failed
